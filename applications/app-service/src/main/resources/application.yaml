server:
  port: "${SERVER_PORT:8081}"
spring:
  application:
    name: "${APP_NAME:solicitudes}"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
springdoc:
  api-docs:
    path: "/v3/api-docs"
  swagger-ui:
    path: "/swagger-ui"
    try-it-out-enabled: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "${ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080,http://localhost:8081}"
routes:
  paths:
    solicitud: "/api/v1/solicitud"
adapters:
  r2dbc:
    host: "${SPRING_R2DBC_URL:localhost}"
    port: "${SPRING_R2DBC_PORT:5432}"
    database: "${SPRING_R2DBC_DB_NAME:Autenticacion}"
    schema: "${SPRING_R2DBC_SCHEMA:crediya}"
    username: "${SPRING_R2DBC_USERNAME:postgres}"
    password: "${SPRING_R2DBC_PASSWORD:root}"
adapter:
  restconsumer:
    timeout: 50000
    url: "${AUTH_BASE_URL:http://localhost:8080/api/v1}"
  sqs:
    update:
      region: "${REGION:us-east-1}"
      queueUrl: "${QUEUEURL:https://sqs.us-east-1.amazonaws.com/119570504750/QueueUpdateApplication}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
    calculator:
      queueUrl: "${QUEUEURL_CAPACIDAD:https://sqs.us-east-1.amazonaws.com/119570504750/QueueLoanCalculator}"
    approved:
      queueUrl: "${QUEUEURL_APROBADA:https://sqs.us-east-1.amazonaws.com/119570504750/QueueApprovedApplications}"
logging:
  level:
    co.com.pragma.crediya.sqs: "DEBUG"
    software.amazon.awssdk: "INFO"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
entrypoint:
  sqs:
    region: "${REGION:us-east-1}"
    queueUrl: "${QUEUEURL_RESULTLOAN:https://sqs.us-east-1.amazonaws.com/119570504750/QueueLoanResult}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
    AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
    AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"